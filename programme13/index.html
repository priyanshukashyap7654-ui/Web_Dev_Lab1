<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P13 - Flexbox vs Grid Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header class="navbar">
        <div class="logo">My Portfolio</div>
        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main class="content-grid">
        <div class="card">
            <h3>Flexbox Section</h3>
            <p>Used for 1-dimensional alignment like navbars and buttons.</p>
        </div>
        <div class="card">
            <h3>Grid Section</h3>
            <p>Used for 2-dimensional layouts like full page structures and card grids.</p>
        </div>
    </main>

</body>
</html>
